# ForgeKairos's own release builds. Upstream's release.yml and run_bundling.yml
# need Zed's private runners and secrets, so this workflow stands beside them.
# Every job runs the script a developer runs (script/bundle.ps1 -Os <os>).
#
# A full build takes hours per operating system, so it never runs on push or
# pull request: only when started by hand (or by script/bundle.ps1 through `gh workflow run`) and when
# a v* tag is pushed, which also makes a draft release with every package.
name: ForgeKairos release

on:
  workflow_dispatch:
    inputs:
      os:
        description: "What to build: all, or a comma-separated list of windows, linux and macos"
        type: string
        default: all
      macos_arch:
        description: "macOS architectures"
        type: choice
        options:
          - both
          - aarch64
          - x86_64
        default: both
      release_tag:
        description: "The release tag compiled into the build for the update check (v1.2.3 or v1.2.3-pre); empty for none"
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: forgekairos-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  windows:
    if: github.event_name == 'push' || inputs.os == 'all' || contains(inputs.os, 'windows')
    # windows-2022 for Visual Studio 2022: script/lib/windows-release-build.ps1
    # and the clang-format copy look for it by that version.
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Build scripts of dependencies run in these jobs; keep the token out of .git/config.
          persist-credentials: false
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install zig and Inno Setup
        shell: pwsh
        run: |
          # The Linux remote server is cross-built with cargo-zigbuild, and
          # bundle-windows.ps1 installs zig with winget, which runners lack.
          choco install zig innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle
        shell: pwsh
        run: |
          # An array splat passes '-Os' as a value; only a hashtable splat names parameters.
          $arguments = @{ Os = 'windows'; Architecture = 'x86_64' }
          if ($env:RELEASE_TAG) { $arguments.ReleaseTag = $env:RELEASE_TAG }
          ./script/bundle.ps1 @arguments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgekairos-windows-x86_64-setup.exe
          path: target/forgekairos-windows-x86_64-setup.exe
          if-no-files-found: error

  linux:
    if: github.event_name == 'push' || inputs.os == 'all' || contains(inputs.os, 'linux')
    # The package runs on this glibc or newer; script/bundle.ps1 builds in an
    # ubuntu:22.04 container elsewhere, so both give the same baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Build scripts of dependencies run in these jobs; keep the token out of .git/config.
          persist-credentials: false
      - name: Install build dependencies
        run: ./script/linux
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Bundle
        shell: pwsh
        run: |
          # An array splat passes '-Os' as a value; only a hashtable splat names parameters.
          $arguments = @{ Os = 'linux'; Architecture = 'x86_64' }
          if ($env:RELEASE_TAG) { $arguments.ReleaseTag = $env:RELEASE_TAG }
          ./script/bundle.ps1 @arguments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgekairos-linux-x86_64.tar.gz
          path: target/forgekairos-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgekairos-remote-server-linux-x86_64.gz
          path: target/forgekairos-remote-server-linux-x86_64.gz
          if-no-files-found: error

  macos:
    if: github.event_name == 'push' || inputs.os == 'all' || contains(inputs.os, 'macos')
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.macos_arch == 'aarch64' && '["aarch64"]') || (inputs.macos_arch == 'x86_64' && '["x86_64"]') || '["aarch64","x86_64"]') }}
    # Apple silicon builds both: x86_64 is cross-compiled, as upstream does.
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Build scripts of dependencies run in these jobs; keep the token out of .git/config.
          persist-credentials: false
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.arch }}
      - name: Install zig
        # script/bundle-mac cross-compiles the Linux remote server it ships
        # in the app with cargo-zigbuild, which needs zig.
        run: brew install zig
      - name: Bundle
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          # Only this step sees the signing secrets, not the actions around it.
          # Without them the bundle is signed ad hoc and not notarized
          # (script/bundle-mac checks that all of them are set).
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          # An array splat passes '-Os' as a value; only a hashtable splat names parameters.
          $arguments = @{ Os = 'macos'; Architecture = $env:ARCH }
          if ($env:RELEASE_TAG) { $arguments.ReleaseTag = $env:RELEASE_TAG }
          ./script/bundle.ps1 @arguments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgekairos-macos-${{ matrix.arch }}.dmg
          path: target/forgekairos-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgekairos-remote-server-macos-${{ matrix.arch }}.gz
          path: target/forgekairos-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error

  draft_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "ForgeKairos $TAG" \
            --generate-notes \
            "${prerelease[@]}"
