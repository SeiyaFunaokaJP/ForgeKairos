# Builds the ForgeKairos documentation site in `pages/` with mdBook and publishes it to
# GitHub Pages. Upstream's documentation (`docs/`) has its own workflows and is not
# touched here.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.37"

jobs:
  build:
    if: github.repository_owner == 'SeiyaFunaokaJP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build the English book
        run: mdbook build pages

      # Built second: building the English book empties `pages/book`, including `ja/`.
      - name: Build the Japanese book
        run: mdbook build pages/ja

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
