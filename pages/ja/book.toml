# The Japanese edition. It is a second book over `../src/ja`, built after the English
# one into its `ja/` folder (see `.github/workflows/pages.yml`).
[book]
title = "ForgeKairos"
description = "Zed エディターのフォーク ForgeKairos が Zed に足した機能の文書。"
language = "ja"
src = "../src/ja"

[build]
build-dir = "../book/ja"
create-missing = false

[output.html]
site-url = "/ForgeKairos/ja/"
git-repository-url = "https://github.com/SeiyaFunaokaJP/ForgeKairos"
edit-url-template = "https://github.com/SeiyaFunaokaJP/ForgeKairos/edit/main/pages/src/ja/{path}"
no-section-label = true
# The script lives beside the English book.toml; it lands in the site root, which both books share.
additional-js = ["../mermaid-init.js"]

[output.html.search]
enable = true
