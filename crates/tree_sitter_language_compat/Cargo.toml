# Compatibility shim for `tree-sitter-language`; see
# `src/tree_sitter_language_compat.rs` for why it exists.
[package]
name = "tree-sitter-language"
version = "0.1.7"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/tree_sitter_language_compat.rs"

[dependencies]
tree_sitter_language_upstream = { package = "tree-sitter-language", git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
