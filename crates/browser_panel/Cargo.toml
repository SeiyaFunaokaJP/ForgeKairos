[package]
name = "browser_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/browser_panel.rs"

[features]
test-support = []

[dependencies]
anyhow.workspace = true
async-recursion.workspace = true
browser_control.workspace = true
db.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
http_client.workspace = true
i18n.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
settings_json.workspace = true
ui.workspace = true
url.workspace = true
urlencoding.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true

# WebView2 hosts the actual browsing surface; it exists on Windows only.
# `windows` 0.62 is required by `webview2-com` 0.39 and deliberately coexists
# with the workspace-wide `windows` 0.61 used by gpui_windows: the two only meet
# at the FFI boundary, where the HWND is passed as a raw isize.
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
