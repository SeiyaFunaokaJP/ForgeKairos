[package]
name = "sandbox"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/sandbox.rs"

[features]
# Builds `bwrap_test_helper`, the behavior helper driven by the NixOS sandbox
# VM tests in `nix/tests/sandboxing`. Off by default so normal builds don't
# produce the test binary. Pulls in serde only when enabled (the helper parses
# its check list as JSON), and enables the matching `http_proxy` escape hatch so
# the in-process proxy can reach the VM's private-network echo servers.
nixos-test = [
    "dep:serde",
    "dep:serde_json",
    "http_proxy/nixos-integration-tests",
]

# Builds `wsl_sandbox_test_helper`, the Windows analog of `bwrap_test_helper`.
# It drives the real WSL/Bubblewrap sandbox end-to-end (see
# `script/test-wsl-sandbox.ps1` / `cargo xtask wsl-sandbox-tests`). Off by
# default so normal builds and the workspace test run don't produce it.
wsl-test = []

# Builds `remote_sandbox_test_helper`, the ADR-F18 acceptance driver. It runs the
# real remote (netns + slirp4netns + Landlock/mount-jail) helper end-to-end on a
# Linux host (see `docs/jp-enhance/DESIGN.md` §4.18). Off by default and only
# meaningful cross-compiled to a Linux target.
remote-sandbox-test = []

# Behavior test helper for the Linux Bubblewrap sandbox. Only built when the
# `nixos-test` feature is enabled (and only meaningful on Linux).
[[bin]]
name = "bwrap_test_helper"
path = "src/bwrap_test_helper.rs"
required-features = ["nixos-test"]

# Behavior test helper for the Windows WSL/Bubblewrap sandbox. Only built when
# the `wsl-test` feature is enabled (and only meaningful on Windows).
[[bin]]
name = "wsl_sandbox_test_helper"
path = "src/wsl_sandbox_test_helper.rs"
required-features = ["wsl-test"]

# ADR-F18 remote sandbox acceptance driver. Only built (and only meaningful) on
# Linux, cross-compiled for the remote host's target.
[[bin]]
name = "remote_sandbox_test_helper"
path = "src/remote_sandbox_test_helper.rs"
required-features = ["remote-sandbox-test"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
# The editor-wide allowlist's host patterns, which the WSL helper's proxy
# enforces with the same matching `egress_policy` uses (ADR-F17 / ADR-F46).
http_client.workspace = true
http_proxy.workspace = true
log.workspace = true
# Picks the port a sandbox's IDE channel is offered on inside its own network
# namespace (ADR-F49 `new_inner_ide_port`); the client that picks it may be any
# OS, since an SSH host's bridge is started from there too (ADR-F53).
rand.workspace = true
# Used only by the `nixos-test` helper binary to parse its check list; gated
# behind the `nixos-test` feature so normal builds don't pull it in.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# Safe wrappers for the SCM_RIGHTS fd-passing and `fstat` the bind validator
# needs, so that code doesn't hand-roll `msghdr`/`CMSG_*`/`mem::zeroed` unsafe.
# `net` is for `getifaddrs`: the egress proxy refuses the addresses the host it
# runs on holds, which no list of host patterns can name (ADR-F49).
nix = { workspace = true, features = ["fs", "net", "socket", "uio"] }
# Builds the in-sandbox seccomp-BPF filter that blocks the untrusted command from
# creating `AF_UNIX` (and other non-IP) sockets, `io_uring`, `ptrace`, etc. — the
# syscall-level half of preventing session-IPC-socket sandbox escapes.
seccompiler.workspace = true
# Checks the `slirp4netns` beside the WSL helper against the digest the Windows
# side shipped before running it (ADR-F46).
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
# For the `#[gpui::property_test]` in the writable-grant normalization tests.
# `proptest` comes transitively via `gpui::proptest`.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
# The built-in protected-path tests build a fake home directory on disk.
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Decompresses the bundled Linux helper while copying it into WSL (ADR-F46).
async-compression.workspace = true
# Names the helper's per-build directory inside WSL and verifies the copy.
sha2.workspace = true
smol.workspace = true
# Structural WSL-installed check (registered distros under HKCU\...\Lxss)
# without spawning `wsl.exe`.
windows-registry.workspace = true
