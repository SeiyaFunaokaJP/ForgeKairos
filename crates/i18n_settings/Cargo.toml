[package]
name = "i18n_settings"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Connects the translation catalogs to the ui_language setting and to GPUI"

[lints]
workspace = true

[lib]
path = "src/i18n_settings.rs"
doctest = false

[features]
test-support = []

[dependencies]
gpui.workspace = true
i18n.workspace = true
i18n_catalog.workspace = true
log.workspace = true
parking_lot.workspace = true
paths.workspace = true
serde.workspace = true
settings.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
