syntax = "proto3";
package zed.messages;

import "task.proto";

message GetAgentServerCommand {
  uint64 project_id = 1;
  string name = 2;
  optional string root_dir = 3;
  // ADR-F49: every folder of the project, which names the agent's
  // configuration folder on the host.
  repeated string project_roots = 4;
}

message GetContextServerCommand {
  uint64 project_id = 1;
  string server_id = 2;
  optional string root_dir = 3;
}

message ContextServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
}

message AgentServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string root_dir = 4;

  optional SpawnInTerminal login = 5;
  // ADR-F49: set by a host that placed the agent in the project's sandbox.
  // A host too old to leave it unset.
  optional AgentServerSandbox sandbox = 6;
  // ADR-F49: why a host that tried to place the agent could not.
  optional string sandbox_error = 7;
}

message AgentServerSandbox {
  // The agent's configuration folder on the host, which it may write.
  string config_dir = 1;
  // The agent's own environment and its profile's, none of the host's.
  map<string, string> env = 2;
  // What the agent runs from inside the host's Zed data directory.
  repeated string readable_paths = 3;
  // The hosts the agent talks to, unless it takes the IDE-wide allowlist.
  repeated string hosts = 4;
  bool hosts_from_editor_allowlist = 5;
}

// ADR-F49 decision 18 (C): what still runs inside the sandbox an agent was
// started in, as the host sees it from *outside* that sandbox. The client
// cannot ask the agent itself: anything a sandboxed command can write, it can
// also lie on, and a leftover process that reports itself gone is exactly what
// the pause exists to catch. A server from before this message cannot decode
// it and never answers, so the client gives up after a while and keeps the
// agent a writer for as long as its session lasts (decision 18, case B).
message ListSandboxProcesses {
  uint64 project_id = 1;
  // The opaque id the client gave the sandbox when it started the agent.
  string session_id = 2;
}

message SandboxProcess {
  // The pid on the host, never the one the process sees inside its namespace.
  uint32 pid = 1;
  // Ticks since boot at which it started, so a recycled pid is not mistaken
  // for the process that held it.
  uint64 start_time = 2;
  string command = 3;
  // How long it has been running, in seconds, worked out on the host: its
  // start time is in that kernel's ticks since that host's boot.
  uint64 running_for = 4;
}

message ListSandboxProcessesResponse {
  repeated SandboxProcess processes = 1;
}

// ADR-F49 decision 18 (C): stops exactly these processes of that sandbox —
// never the agent itself, which the user stops from its own panel.
message StopSandboxProcesses {
  uint64 project_id = 1;
  string session_id = 2;
  repeated SandboxProcessKey processes = 3;
}

message SandboxProcessKey {
  uint32 pid = 1;
  uint64 start_time = 2;
}

message StopSandboxProcessesResponse {
  uint32 stopped = 1;
}

message ExternalAgentsUpdated {
  uint64 project_id = 1;
  repeated string names = 2;
}

message ExternalExtensionAgentTarget {
  string archive = 1;
  string cmd = 2;
  repeated string args = 3;
  optional string sha256 = 4;
  map<string, string> env = 5;
}

message ExternalExtensionAgent {
  string name = 1;
  optional string icon_path = 2;
  string extension_id = 3;
  map<string, ExternalExtensionAgentTarget> targets = 4;
  map<string, string> env = 5;
  optional string version = 6;
}

message ExternalExtensionAgentsUpdated {
  uint64 project_id = 1;
  repeated ExternalExtensionAgent agents = 2;
}

message ExternalAgentLoadingStatusUpdated {
  uint64 project_id = 1;
  string name = 2;
  reserved 3;
  optional string status = 4;
}

message NewExternalAgentVersionAvailable {
  uint64 project_id = 1;
  string name = 2;
  string version = 3;
}
