syntax = "proto3";
package zed.messages;

message ShutdownRemoteServer {}

message Toast {
  uint64 project_id = 1;
  string notification_id = 2;
  string message = 3;
}

message HideToast {
  uint64 project_id = 1;
  string notification_id = 2;
}

// A telemetry event generated on the remote server, forwarded to the client for
// reporting. The OS metadata is not included: the client already knows the
// remote platform from connection setup and attaches it when reporting.
message TelemetryEvent {
  uint64 project_id = 1;
  // JSON-serialized telemetry_events::FlexibleEvent { event_type, event_properties }.
  string event_json = 2;
}

message OpenServerSettings {
  uint64 project_id = 1;
}

// Pushes the connecting IDE's egress allowlist to the remote host so the
// host's own outgoing HTTP(S) requests (LSP/node downloads, extensions, LLM
// providers) are gated by the same list. The allowlist on the client side is
// the source of truth (see docs/jp-enhance/DESIGN.md ADR-F11); this is sent once,
// right after the connection is established, and is not re-sent if the local
// allowlist changes later in the session — the remote host picks up the
// current allowlist again on its next fresh connection.
message SetEgressAllowlist {
  repeated string allowed_hosts = 1;
  // The user's `proxy_child_processes` choice, so the remote host runs (or
  // does not run) the same child-process egress proxy for the ACP agents, MCP
  // servers and npm invocations that execute over there (ADR-F14). Absent —
  // an older client — means on, which is what the policy file's absent value
  // means too: the mechanism is opted out of, never into.
  optional bool proxy_child_processes = 2;
}

message GetCrashFiles {}

message GetCrashFilesResponse {
  repeated CrashReport crashes = 1;
  reserved 2; // old panics
}

message CrashReport {
  reserved 1, 2;
  string metadata = 3;
  bytes minidump_contents = 4;
}

message Extension {
  string id = 1;
  string version = 2;
  bool dev = 3;
}

message SyncExtensions {
  repeated Extension extensions = 1;
}

message SyncExtensionsResponse {
  string tmp_dir = 1;
  repeated Extension missing_extensions = 2;
}

message InstallExtension {
  Extension extension = 1;
  string tmp_dir = 2;
}

message AskPassRequest {
  uint64 project_id = 1;
  reserved 2;
  uint64 repository_id = 3;
  uint64 askpass_id = 4;
  string prompt = 5;
}

message AskPassResponse {
  string response = 1;
}

message GetRemoteProfilingData {
  uint64 project_id = 1;
  bool foreground_only = 2;
}

message GetRemoteProfilingDataResponse {
  repeated RemoteProfilingThread threads = 1;
  uint64 now_nanos = 2;
}

message RemoteProfilingThread {
  optional string thread_name = 1;
  uint64 thread_id = 2;
  repeated RemoteProfilingTiming timings = 3;
}

message RemoteProfilingTiming {
  RemoteProfilingLocation location = 1;
  uint64 start_nanos = 2;
  uint64 duration_nanos = 3;
}

message RemoteProfilingLocation {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
}

// ADR-F27 (docs/jp-enhance/DESIGN.md §4.27): a remote host that cannot reach
// the internet relays its outgoing HTTP(S) through the connected IDE, so that
// language server / node / extension downloads run against the client's
// allowlist, consent flow and proxy instead of the remote host's network.
//
// Direction is remote_server -> client, the opposite of most requests here.
// The client answers `Ack` as soon as it has taken the request, then streams
// `ProxyHttpResponse` messages back with the same `request_id`.
message ProxyHttpRequest {
  // Correlates the response frames below with this request. Unique per
  // remote_server process, allocated by the relay that sends this.
  uint64 request_id = 1;
  string method = 2;
  string url = 3;
  repeated ProxyHttpHeader headers = 4;
  bytes body = 5;
  // Whether the client should follow redirects on the remote's behalf. Each
  // hop is re-checked against the client's allowlist either way.
  bool follow_redirects = 6;
  // The deadline the caller on the remote host asked for, carried across so
  // that a request with one (`http_client::HttpRequestExt::timeout`) keeps it
  // instead of falling back on the relay's much longer stall timeout.
  optional uint64 timeout_millis = 7;
}

message ProxyHttpHeader {
  string name = 1;
  string value = 2;
}

// One frame of the response to a `ProxyHttpRequest`. The first frame carries
// `status` and `headers`; later frames carry body bytes only. `chunk` is
// capped at 256 KiB so that a multi-megabyte download does not monopolize the
// RPC channel, and each frame is a request whose `Ack` paces the sender.
message ProxyHttpResponse {
  uint64 request_id = 1;
  uint32 status = 2;
  repeated ProxyHttpHeader headers = 3;
  bytes chunk = 4;
  // Set on the frame that ends the body. No further frames follow.
  bool is_last = 5;
  // Set instead of a body frame when the request failed. Terminal.
  optional ProxyHttpError error = 6;
}

message ProxyHttpError {
  oneof kind {
    ProxyHttpEgressDenied egress_denied = 1;
    ProxyHttpNetworkError network = 2;
    ProxyHttpOtherError other = 3;
  }
}

// The client's egress allowlist refused the request. Kept as its own variant
// so the remote host can rebuild `http_client::EgressDenied` and let the
// ADR-F22 consent flow classify the failure, rather than seeing an opaque
// string.
message ProxyHttpEgressDenied {
  string host = 1;
  // The requested URL with its query string removed.
  string url = 2;
}

message ProxyHttpNetworkError {
  string message = 1;
}

message ProxyHttpOtherError {
  string message = 1;
}
