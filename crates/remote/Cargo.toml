[package]
name = "remote"
description = "Client-side subsystem for remote editing"
edition.workspace = true
version = "0.1.0"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/remote.rs"
doctest = false

[features]
default = []
build-remote-server-binary = []
test-support = ["fs/test-support"]

[dependencies]
anyhow.workspace = true
askpass.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
collections.workspace = true
egress_policy.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
hex.workspace = true
# ADR-F27: this crate carries both ends of the HTTP relay, so it needs the
# `HttpClient` trait and the relay types the remote host's client is built on.
http_client.workspace = true
log.workspace = true
parking_lot.workspace = true
paths.workspace = true
release_channel.workspace = true
rpc = { workspace = true, features = ["gpui"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sha2.workspace = true
smol.workspace = true
telemetry.workspace = true
tempfile.workspace = true
thiserror.workspace = true
urlencoding.workspace = true
util.workspace = true
which.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
util = { workspace = true, features = ["test-support"] }
