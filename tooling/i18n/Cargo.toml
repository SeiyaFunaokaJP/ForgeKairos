[package]
name = "i18n_tool"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Fork-only tooling for moving Zed's hard-coded Japanese UI strings onto gettext catalogs"

[lints]
workspace = true

[[bin]]
name = "i18n_tool"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
i18n.workspace = true
i18n_catalog.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
